<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes wavePath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 260px; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
    .stream-wave {
      stroke-dasharray: 20, 10;
      animation: wavePath 25s linear infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Dynamic Background Ambient Orbs (Behind content) -->
  <circle class="orb-1" cx="220" cy="90" r="140" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="270" r="160" fill="#ec4899" filter="url(#glow)" />
  <circle cx="600" cy="340" r="110" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />

  <!-- Abstract Stream Audio/Video Waves (Dynamic line in lower third) -->
  <path class="stream-wave" d="M -50,290 C 200,240 350,330 600,285 C 850,240 1000,320 1250,270" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.45" />
  <path class="stream-wave" d="M -50,310 C 250,340 450,260 700,315 C 950,360 1050,270 1250,300" fill="none" stroke="url(#cyanBlue)" stroke-width="2" opacity="0.35" />

  <!-- Animated Floating Feature Badges (Left & Right margins, strictly avoiding center text) -->
  <!-- Left Pill: 4K / AV1 / HDR -->
  <g class="pill-1" transform="translate(60, 48)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">⚡ 4K • HDR • AV1</text>
  </g>

  <!-- Left Lower Pill: Self-Hosted -->
  <g class="pill-2" transform="translate(70, 240)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="6" fill="#a855f7" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🛡️ Self-Hosted Ecosystem</text>
  </g>

  <!-- Right Pill: WebRTC & HLS -->
  <g class="pill-1" transform="translate(970, 52)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="6" fill="#06b6d4" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">📡 WebRTC • HLS • SRT</text>
  </g>

  <!-- Right Lower Pill: Multi-Platform -->
  <g class="pill-2" transform="translate(960, 240)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow)" />
    <circle cx="20" cy="18" r="6" fill="#ec4899" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🎬 Cross-Platform Playback</text>
  </g>

  <!-- Central Foreground Content (Guaranteed clear & legible) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ULTIMATE CURATED DIRECTORY</text>
  </g>

  <!-- Main Title with Gradient fill -->
  <text class="text-title" x="600" y="152" text-anchor="middle" font-size="44" fill="#ffffff" filter="url(#shadow)">
    Media Players &amp; Video Streaming
  </text>
  <text class="text-title" x="600" y="152" text-anchor="middle" font-size="44" fill="url(#primaryGlow)" opacity="0.35">
    Media Players &amp; Video Streaming
  </text>

  <!-- Subtitle -->
  <text class="text-sub" x="600" y="196" text-anchor="middle" font-size="17" fill="#94a3b8" letter-spacing="0.2">
    Personal Media Servers • Local Video Players • Live Broadcasts • Self-Hosted Streaming
  </text>

  <!-- Bottom Badges / Metrics Row -->
  <g transform="translate(365, 235)">
    <!-- Badge 1: Open Source & Self-Hosted -->
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="70" y="18" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🚀 Top FOSS Stacks</text>

    <!-- Badge 2: SaaS & Cloud -->
    <rect x="155" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="232" y="18" text-anchor="middle" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">💎 Enterprise &amp; SaaS</text>

    <!-- Badge 3: GitHub Stars Tracked -->
    <rect x="325" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="397" y="18" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">⭐ Live Star Badges</text>
  </g>
</svg>